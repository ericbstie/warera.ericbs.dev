[tools]
bun = "latest"

# `mise bootstrap` installs this as the systemd user unit dev.mise.warera:
# it starts on boot, restarts on a crash, and logs to the journal.
[bootstrap.linux.systemd.units.warera]
description = "warera.ericbs.dev"
exec_start = "{{ mise_bin }} exec -- bun run --watch src/index.ts"
working_directory = "{{ config_root }}"
environment = { NODE_ENV = "production", PORT = "4000" }
restart = "always"
restart_sec = "5"
standard_output = "journal"
standard_error = "journal"

# `bun lint` only ships in Bun canary builds so far, so it runs through bunx
# until it reaches a stable release.
[tasks.check]
description = "Type check, lint and check formatting"
run = ["bun check", "bunx bun@canary lint", "bun fmt --check"]

[tasks.fix]
description = "Fix lint problems and format the code"
run = ["bunx bun@canary lint --fix", "bun fmt"]
